<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amor de Mãe · Links</title>
<meta name="description" content="Moda bebê e infantil do P ao 16. Envio para todo o Brasil.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ameixa:#594560; --lilas:#B197B4; --menta:#B5DCD4; --rosinha:#FCEFEE; --branco:#FFFFFF;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    font-family:'Nunito',system-ui,sans-serif;
    color:var(--ameixa);
    background:linear-gradient(135deg,#ecdff0 0%,#f7eef5 50%,#e4f0ee 100%);
    display:flex;justify-content:center;
  }
  .page{
    position:relative;width:100%;max-width:480px;min-height:100vh;
    padding:48px 24px 32px;
    display:flex;flex-direction:column;align-items:center;
    background:url("fundo.jpg") center top / cover no-repeat;
    box-shadow:0 0 40px rgba(89,69,96,.10);
  }

  .logo{width:230px;max-width:70%;height:auto;margin:36px 0 18px;filter:drop-shadow(0 6px 14px rgba(89,69,96,.12))}
  .bio{font-size:15px;line-height:1.5;text-align:center;font-weight:700;max-width:320px;margin-bottom:30px}

  .links{width:100%;display:flex;flex-direction:column;gap:16px}
  .btn{
    position:relative;display:flex;align-items:center;gap:12px;
    width:100%;min-height:64px;padding:10px 16px 10px 10px;
    background:rgba(255,255,255,.75);
    border:1.5px solid rgba(177,151,180,.5);
    border-radius:18px;
    text-decoration:none;color:var(--ameixa);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    box-shadow:0 4px 14px rgba(89,69,96,.08);
    transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .btn:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(89,69,96,.14);background:rgba(255,255,255,.92)}
  .btn .icone{flex:0 0 44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center}
  .btn .icone svg{width:22px;height:22px}
  .btn .texto{flex:1;text-align:center;padding-right:44px;line-height:1.25}
  .btn .titulo{display:block;font-weight:800;font-size:15.5px}
  .btn .sub{display:block;font-weight:700;font-size:12.5px;opacity:.8;margin-top:2px}
  .i-whats{background:var(--menta);color:var(--ameixa)}
  .i-site{background:var(--rosinha);color:var(--ameixa);border:1px solid rgba(177,151,180,.4)}

  .btn.vip{background:var(--ameixa);color:var(--branco);border-color:var(--ameixa);box-shadow:0 8px 24px rgba(89,69,96,.28)}
  .btn.vip:hover{background:#4c3a52}
  .btn.vip .icone{background:rgba(255,255,255,.16);color:var(--branco)}
  .selo{
    position:absolute;top:-10px;right:14px;
    background:var(--menta);color:var(--ameixa);
    font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;
    padding:3px 10px;border-radius:999px;box-shadow:0 2px 8px rgba(89,69,96,.15);
  }

  footer{margin-top:auto;padding-top:56px;font-size:12.5px;font-weight:700;opacity:.75;text-align:center}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="page">
  <img class="logo" src="logo.png" alt="Amor de Mãe · Moda bebê e infantil">

  <p class="bio">💕 Vista seu pequeno com Amor <br>👶 Moda bebê e infantil | P ao 16<br>🚚 Envio para todo o Brasil</p>

  <div class="links">
    <a id="b-whatsapp" class="btn" href="#">
      <span class="icone i-whats">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 20l1.2-4A8.5 8.5 0 1 1 8.4 19z"/></svg>
      </span>
      <span class="texto"><span class="titulo">Atendimento personalizado no WhatsApp</span></span>
    </a>

    <a id="b-site" class="btn" href="#">
      <span class="icone i-site">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1.2 11.2a1 1 0 0 1-1 .8H7.2a1 1 0 0 1-1-.8z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg>
      </span>
      <span class="texto"><span class="titulo">Compre com agilidade no site</span></span>
    </a>

    <a id="b-vip" class="btn vip" href="#">
      <span class="selo">VIP</span>
      <span class="icone">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 8l4.5 3.5L12 5l4.5 6.5L21 8l-2 10H5z"/></svg>
      </span>
      <span class="texto">
        <span class="titulo">Entre no Grupo VIP</span>
        <span class="sub">Novidades e ofertas antes de todo mundo</span>
      </span>
    </a>
  </div>

  <footer>Amor de Mãe · Itabirito/MG</footer>
</main>

<script>
/* ============ CONFIGURAÇÃO – edite só aqui ============ */
const CONFIG = {
  whatsappNumero: "5531998605457",
  whatsappMensagem: "Oi, Day! Vim pelo Instagram 💕",
  grupoVip: "https://chat.whatsapp.com/BRqZPKC2IvgDctLlFmn6AW",
  site: "https://amordemaeshop.com.br/?utm_source=instagram&utm_medium=bio&utm_campaign=linkbio"
};
/* ===================================================== */
const wa = "https://wa.me/" + CONFIG.whatsappNumero + "?text=" + encodeURIComponent(CONFIG.whatsappMensagem);
const mapa = { "b-whatsapp": wa, "b-site": CONFIG.site, "b-vip": CONFIG.grupoVip };
for (const [id, url] of Object.entries(mapa)) {
  const el = document.getElementById(id);
  el.href = url; el.target = "_blank"; el.rel = "noopener";
}
</script>
</body>
</html>
